[build]
  base = "website"
  command = "npm run build"
  publish = "dist"

[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "http://www.alisondaytherapy.com/*"
  to = "https://alisondaytherapy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alisondaytherapy.com/*"
  to = "https://alisondaytherapy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://alisonday.netlify.app/*"
  to = "https://alisondaytherapy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://alisonday.netlify.app/*"
  to = "https://alisondaytherapy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://alisonday.netlify.com/*"
  to = "https://alisondaytherapy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://alisonday.netlify.com/*"
  to = "https://alisondaytherapy.com/:splat"
  status = 301
  force = true

[[edge_functions]]
  function = "canonical-path"
  path = "/*"
